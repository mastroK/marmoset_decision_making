  # the animal set doesn't need to shrink to add the third condition.
  overlapping_animals: ["Fiona", "Knuckles", "Sonic", "Sunflower", "Zazu"]
  reversal_alignment_pre: 5
  reversal_alignment_post: 10
  max_consecutive_losses: 4
  min_trials_per_transition: 10
  states_full: ["Exploit", "Directed Exploration", "Random Exploration", "Left Bias", "Right Bias"]
  states_key_main: ["Exploit", "Directed Exploration"]
  wsls_states: ["Exploit", "Directed Exploration"]
